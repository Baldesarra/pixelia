# Release: Tag vX.Y.Z auf main → Firmware mit dieser Version bauen, Factory-Image erzeugen, GitHub-Release mit
# Release-Notes aus CHANGELOG.json anlegen. Danach aktualisiert der Workflow „Pages“ den Web-Flasher.
# Einfacher Release-Weg für 0.1.x; der volle Release-Workflow (Changelog-Block in der Firmware usw.) folgt in 0.4.x.
name: Release

on:
  push:
    tags: ['v*']

jobs:
  build:
    name: Firmware für das Release bauen
    runs-on: ubuntu-latest
    container: espressif/idf:v6.1
    steps:
      - name: Code holen (mit Tags, für die Version)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Changelog-Eintrag prüfen und Release-Notes erzeugen
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          python3 tools/release_notes.py "$V" > dist/notes.md
          python3 tools/release_notes.py "$V" --title > dist/title.txt
          cat dist/notes.md

      - name: Bauen und Factory-Image
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . "$IDF_PATH/export.sh" > /dev/null
          idf.py -C firmware build
          idf.py -C firmware merge-bin -o pixelia-factory.bin
          V="${GITHUB_REF_NAME#v}"
          cp firmware/build/pixelia.bin "dist/pixelia-v$V.bin"
          cp firmware/build/pixelia-factory.bin "dist/pixelia-v$V-factory.bin"
          cp firmware/build/pixelia.elf "dist/pixelia-v$V.elf"
          ls -l dist

      - name: Ergebnis weitergeben
        uses: actions/upload-artifact@v7
        with:
          name: release
          path: dist/
          retention-days: 90

  release:
    name: GitHub-Release anlegen
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: dist

      - name: Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${GITHUB_REF_NAME#v}"
          PRE=""
          case "$V" in *-*) PRE="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" $PRE \
            --title "$(cat dist/title.txt)" --notes-file dist/notes.md \
            "dist/pixelia-v$V.bin" "dist/pixelia-v$V-factory.bin" "dist/pixelia-v$V.elf"
