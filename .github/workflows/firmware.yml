# Firmware bauen (ESP-IDF v6.1, ESP32-S3), Größe prüfen, Ergebnis als Artefakt ablegen.
name: Firmware

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Firmware bauen
    runs-on: ubuntu-latest
    container: espressif/idf:v6.1
    steps:
      - name: Code holen (mit Tags, für die Version)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Changelog prüfen (Format, Bereiche, Reihenfolge)
        shell: bash
        run: python3 tools/release_notes.py --check

      - name: Bauen
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . "$IDF_PATH/export.sh" > /dev/null
          idf.py -C firmware build
          # Factory-Image: Bootloader, Partitionstabelle und App in einer Datei ab Adresse 0x0 (Web-Flasher)
          idf.py -C firmware merge-bin -o pixelia-factory.bin

      - name: Größenbericht und Budget (max. 75 % der App-Partition)
        shell: bash
        run: |
          . "$IDF_PATH/export.sh" > /dev/null
          BIN=firmware/build/pixelia.bin
          SIZE=$(stat -c %s "$BIN")
          PART=$((0x600000))
          LIMIT=$((PART * 75 / 100))
          PCT=$((SIZE * 100 / PART))
          VERSION=$(git describe --tags --match 'v[0-9]*' --dirty 2>/dev/null || echo "0.0.0-dev+$(git rev-parse --short HEAD)")
          {
            echo "## Firmware $VERSION"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| App-Image | $((SIZE / 1024)) KB |"
            echo "| App-Partition | $((PART / 1024)) KB |"
            echo "| Belegt | ${PCT} % (Budget 75 %) |"
            echo ""
            echo '<details><summary>Speicherbelegung (idf.py size)</summary>'
            echo ""
            echo '```'
            idf.py -C firmware size 2>/dev/null | grep -v '^Executing\|^Running\|^Setting\|^Adding'
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$SIZE" -gt "$LIMIT" ]; then
            echo "::error::Firmware ist $SIZE Byte groß, Budget sind $LIMIT Byte (75 % der App-Partition)."
            exit 1
          fi
          echo "Firmware $SIZE Byte = ${PCT} % der App-Partition"

      - name: Artefakt ablegen
        uses: actions/upload-artifact@v7
        with:
          name: pixelia-firmware-${{ github.sha }}
          path: |
            firmware/build/pixelia.bin
            firmware/build/pixelia-factory.bin
            firmware/build/pixelia.elf
            firmware/build/bootloader/bootloader.bin
            firmware/build/partition_table/partition-table.bin
            firmware/build/ota_data_initial.bin
            firmware/build/flash_args
          retention-days: 30
